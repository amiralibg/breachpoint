# Production: `docker compose up -d --build`, then open http://<server>:8080
# Behind Dokploy, point the domain at container port 80 instead and drop `ports`.
services:
  web:
    build: .
    image: breachpoint:latest
    restart: always
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
