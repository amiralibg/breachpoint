server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Types the default mime.types lacks: glTF models, HDR skies, WebAssembly (physics, navmesh)
    include /etc/nginx/mime.types;
    types {
        model/gltf-binary glb;
        model/gltf+json gltf;
        image/vnd.radiance hdr;
        application/wasm wasm;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm model/gltf+json model/gltf-binary image/vnd.radiance audio/wav image/svg+xml;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Built bundles are content-hashed; textures, models and sounds rarely change
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
